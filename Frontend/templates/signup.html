<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FaceGuard - Sign Up</title>
  <style>
    *, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0e17;--surface:#111827;--border:#1e2d45;--accent:#00d4ff;--success:#10b981;--danger:#ef4444;--text:#e2e8f0;--muted:#64748b;--font:'Courier New',monospace}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
    header{text-align:center;margin-bottom:2rem}
    header h1{font-size:1.8rem;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}
    header p{color:var(--muted);font-size:.82rem;margin-top:.4rem;letter-spacing:.08em}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:620px}
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1.2rem}
    .mode-link{display:block;text-align:center;text-decoration:none;padding:.75rem;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
    .mode-link.active{background:rgba(0,212,255,.12);border-color:var(--accent);color:var(--accent)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
    .field label{font-size:.72rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
    .field input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.6rem .8rem;font-family:var(--font);font-size:.85rem;outline:none}
    .field input:focus{border-color:var(--accent)}
    .camera-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden;border:2px solid var(--border);margin:.2rem 0 1rem}
    #video{width:100%;height:100%;object-fit:cover;display:block}
    #canvas{display:none}
    .scan-line{display:none;position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.8s ease-in-out infinite}
    @keyframes scan{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
    .face-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:220px;border:2px dashed var(--accent);border-radius:50% / 40%;opacity:.45;pointer-events:none}
    .status-bar{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;padding:.75rem 1rem;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:.85rem;letter-spacing:.04em}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent)}
    .dot.success{background:var(--success);box-shadow:0 0 8px var(--success)}
    .dot.danger{background:var(--danger);box-shadow:0 0 8px var(--danger)}
    .btn-row{display:flex;gap:.8rem;margin-top:.4rem}
    button{flex:1;padding:.75rem;border:none;border-radius:8px;font-family:var(--font);font-size:.88rem;letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
    button:active{transform:scale(.98)}
    button:disabled{opacity:.4;cursor:not-allowed}
    #btn-camera,#btn-submit{background:var(--accent);color:#000;font-weight:bold}
    #btn-stop{background:transparent;border:1px solid var(--muted);color:var(--muted)}
    .result{display:none;margin-top:1rem;border-radius:8px;padding:1rem;font-size:.84rem;line-height:1.5}
    .result.success{background:rgba(16,185,129,.1);border:1px solid var(--success);color:var(--success)}
    .result.error{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:var(--danger)}
    footer{margin-top:2rem;font-size:.72rem;color:var(--muted);letter-spacing:.08em}
    @media (max-width:640px){.grid{grid-template-columns:1fr}.card{padding:1.4rem}.btn-row{flex-direction:column}}
  </style>
</head>
<body>
<header>
  <h1>FaceGuard</h1>
  <p>Self-Service Biometric Enrollment</p>
</header>

<div class="card">
  <div class="mode-row">
    <a class="mode-link active" href="/signup/">Sign Up</a>
    <a class="mode-link" href="/">Log In</a>
  </div>

  <div class="grid">
    <div class="field">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="Jane Doe" autocomplete="name"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email"/>
    </div>
  </div>

  <div class="grid">
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input id="password2" type="password" placeholder="Repeat password" autocomplete="new-password"/>
    </div>
  </div>

  <div class="field">
    <label>Department</label>
    <input id="department" type="text" placeholder="Optional"/>
  </div>

  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-line" id="scan-line"></div>
    <div class="face-guide"></div>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Camera inactive.</span>
  </div>

  <div class="btn-row">
    <button id="btn-camera">Start Camera</button>
    <button id="btn-stop" disabled>Stop</button>
    <button id="btn-submit" disabled>Sign Up</button>
  </div>

  <div class="result" id="result"></div>
</div>

<footer>FaceGuard v1.0</footer>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const scanLine = document.getElementById('scan-line');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('status-text');
  const btnCamera = document.getElementById('btn-camera');
  const btnStop = document.getElementById('btn-stop');
  const btnSubmit = document.getElementById('btn-submit');
  const result = document.getElementById('result');

  let stream = null;
  let capturedBlobs = [];

  function setStatus(message, state = '') {
    statusText.textContent = message;
    dot.className = 'dot ' + state;
  }

  function showResult(message, type) {
    result.style.display = 'block';
    result.className = 'result ' + type;
    result.textContent = message;
  }

  function stopCamera(message = 'Camera stopped.', state = '') {
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    scanLine.style.display = 'none';
    btnCamera.disabled = false;
    btnStop.disabled = true;
    setStatus(message, state);
  }

  function captureBlob() {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
  }

  async function captureEnrollmentImages(count = 5, interval = 220) {
    capturedBlobs = [];
    setStatus('Scanning face...', 'active');
    for (let i = 0; i < count; i++) {
      const blob = await captureBlob();
      if (blob) capturedBlobs.push(blob);
      await new Promise(resolve => setTimeout(resolve, interval));
    }
    btnSubmit.disabled = capturedBlobs.length === 0;
    setStatus(`${capturedBlobs.length} face frames captured.`, capturedBlobs.length ? 'success' : 'danger');
  }

  btnCamera.addEventListener('click', async () => {
    try {
      result.style.display = 'none';
      btnCamera.disabled = true;
      setStatus('Starting camera...', 'active');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      await video.play();
      scanLine.style.display = 'block';
      btnStop.disabled = false;
      await captureEnrollmentImages();
    } catch (err) {
      stopCamera(err.message, 'danger');
    }
  });

  btnStop.addEventListener('click', () => stopCamera());

  btnSubmit.addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const department = document.getElementById('department').value.trim();

    if (!name || !email || !password || !password2) {
      showResult('Name, email, password, and confirmation are required.', 'error');
      return;
    }
    if (password !== password2) {
      showResult('Passwords do not match.', 'error');
      return;
    }
    if (!capturedBlobs.length) {
      showResult('Start the camera to capture your face before signing up.', 'error');
      return;
    }

    btnSubmit.disabled = true;
    btnCamera.disabled = true;
    setStatus('Creating account...', 'active');

    const formData = new FormData();
    formData.append('name', name);
    formData.append('email', email);
    formData.append('password', password);
    formData.append('password2', password2);
    formData.append('department', department);
    capturedBlobs.forEach((blob, index) => {
      formData.append('images', blob, `face-${index + 1}.jpg`);
    });

    try {
      const response = await fetch('/api/self-enrol/', { method: 'POST', body: formData });
      const data = await response.json();
      if (!response.ok) {
        const detail = data.message || data.error || JSON.stringify(data.errors || data);
        showResult(detail, 'error');
        setStatus('Registration failed.', 'danger');
        btnSubmit.disabled = false;
        btnCamera.disabled = false;
        return;
      }

      localStorage.setItem('faceguard_access', data.access);
      localStorage.setItem('faceguard_user', JSON.stringify(data.user));
      showResult(data.message || 'Registration successful.', 'success');
      stopCamera('Registration complete.', 'success');
      setTimeout(() => { window.location.href = data.redirect_url || '/dashboard/'; }, 900);
    } catch (err) {
      showResult('Network error: ' + err.message, 'error');
      setStatus('Registration failed.', 'danger');
      btnSubmit.disabled = false;
      btnCamera.disabled = false;
    }
  });
</script>
</body>
</html>
