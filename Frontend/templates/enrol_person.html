<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FaceGuard — Enrol Person</title>
  <style>
    :root{--bg:#0a0e17;--surface:#111827;--border:#1e2d45;--accent:#00d4ff;--success:#10b981;--danger:#ef4444;--text:#e2e8f0;--muted:#64748b;--font:'Courier New',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}

    header{text-align:center;margin-bottom:2rem}
    header h1{color:var(--accent);letter-spacing:.15em;font-size:1.5rem}
    header p{color:var(--muted);font-size:.8rem;margin-top:.3rem}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:560px;display:flex;flex-direction:column;gap:1.2rem}

    .field{display:flex;flex-direction:column;gap:.35rem}
    .field label{font-size:.72rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
    .field input,.field select,.field textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.6rem .8rem;font-family:var(--font);font-size:.85rem;outline:none;transition:border-color .2s}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
    .field textarea{resize:vertical;min-height:60px}

    /* ── Image upload zone ── */
    .upload-zone{border:2px dashed var(--border);border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
    .upload-zone:hover,.upload-zone.drag{border-color:var(--accent)}
    .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .upload-zone p{font-size:.8rem;color:var(--muted)}
    .upload-zone .hint{font-size:.7rem;color:var(--muted);margin-top:.3rem}

    .previews{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-top:.8rem}
    .preview-wrap{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
    .preview-wrap img{width:100%;height:100%;object-fit:cover}
    .preview-wrap button{position:absolute;top:2px;right:2px;background:rgba(239,68,68,.8);border:none;color:#fff;border-radius:3px;width:18px;height:18px;font-size:.7rem;cursor:pointer;line-height:1}

    /* ── Submit ── */
    .btn-submit{background:var(--accent);color:#000;border:none;border-radius:8px;padding:.8rem;font-family:var(--font);font-size:.9rem;font-weight:bold;letter-spacing:.08em;cursor:pointer;transition:opacity .2s}
    .btn-submit:disabled{opacity:.4;cursor:not-allowed}

    /* ── Progress / result ── */
    .progress{display:none;background:rgba(0,212,255,.08);border:1px solid var(--accent);border-radius:8px;padding:1rem;font-size:.8rem;color:var(--accent)}
    .result{display:none;border-radius:8px;padding:1rem;font-size:.82rem}
    .result.success{background:rgba(16,185,129,.1);border:1px solid var(--success);color:var(--success)}
    .result.error  {background:rgba(239,68,68,.1);border:1px solid var(--danger);color:var(--danger)}
  </style>
</head>
<body>

<header>
  <h1>⬡ ENROL PERSON</h1>
  <p>Admin — Register a new face in FaceGuard</p>
</header>

<div class="card">

  <!-- Admin login -->
  <div class="field">
    <label>Admin Email</label>
    <input id="admin-email" type="email" placeholder="admin@company.com"/>
  </div>
  <div class="field">
    <label>Admin Password</label>
    <input id="admin-password" type="password" placeholder="Admin password"/>
  </div>

  <!-- Person details -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="field">
      <label>Full Name *</label>
      <input id="name" type="text" placeholder="Jane Doe"/>
    </div>
    <div class="field">
      <label>Employee ID</label>
      <input id="emp-id" type="text" placeholder="EMP-001"/>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
    <div class="field">
      <label>User Email</label>
      <input id="user-email" type="email" placeholder="jane@company.com"/>
    </div>
    <div class="field">
      <label>User Password</label>
      <input id="user-password" type="password" placeholder="At least 8 characters"/>
    </div>
  </div>

  <div class="field">
    <label>Department</label>
    <input id="dept" type="text" placeholder="Engineering"/>
  </div>

  <div class="field">
    <label>Notes</label>
    <textarea id="notes" placeholder="Optional notes…"></textarea>
  </div>

  <!-- Image upload -->
  <div class="field">
    <label>Face Images (1–5 photos)</label>
    <div class="upload-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" multiple/>
      <p>📷 Drop images here or click to browse</p>
      <div class="hint">JPEG / PNG · Front-facing · Good lighting · 1–5 images</div>
    </div>
    <div class="previews" id="previews"></div>
  </div>

  <div class="progress" id="progress">⏳ Uploading and processing face embeddings…</div>
  <div class="result"   id="result"></div>

  <button class="btn-submit" id="submit-btn" onclick="enrol()">ENROL PERSON</button>
</div>

<script>
  let selectedFiles = [];
  let accessToken = localStorage.getItem('faceguard_access') || '';

  const fileInput = document.getElementById('file-input');
  const dropZone  = document.getElementById('drop-zone');
  const previews  = document.getElementById('previews');

  fileInput.addEventListener('change', () => addFiles(Array.from(fileInput.files)));

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
  });

  function addFiles(files) {
    for (const f of files) {
      if (selectedFiles.length >= 5) break;
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) {
        selectedFiles.push(f);
      }
    }
    renderPreviews();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderPreviews();
  }

  function renderPreviews() {
    previews.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const url  = URL.createObjectURL(f);
      const wrap = document.createElement('div');
      wrap.className = 'preview-wrap';
      wrap.innerHTML = `<img src="${url}"/><button onclick="removeFile(${i})">✕</button>`;
      previews.appendChild(wrap);
    });
  }

  async function enrol() {
    const name  = document.getElementById('name').value.trim();
    if (!name)            { alert('Name is required.');  return; }
    if (!selectedFiles.length) { alert('Add at least one face image.'); return; }

    if (!accessToken) {
      const loginResponse = await fetch('/api/auth/login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('admin-email').value.trim(),
          password: document.getElementById('admin-password').value,
        }),
      });
      const loginData = await loginResponse.json();
      if (!loginResponse.ok || loginData.user.role !== 'admin') {
        alert(loginData.detail || 'Admin login failed.');
        return;
      }
      accessToken = loginData.access;
      localStorage.setItem('faceguard_access', accessToken);
      localStorage.setItem('faceguard_user', JSON.stringify(loginData.user));
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;

    const progress = document.getElementById('progress');
    const result   = document.getElementById('result');
    progress.style.display = 'block';
    result.style.display   = 'none';

    const fd = new FormData();
    fd.append('name',        name);
    fd.append('email',       document.getElementById('user-email').value.trim());
    fd.append('password',    document.getElementById('user-password').value);
    fd.append('employee_id', document.getElementById('emp-id').value.trim());
    fd.append('department',  document.getElementById('dept').value.trim());
    fd.append('notes',       document.getElementById('notes').value.trim());
    selectedFiles.forEach(f => fd.append('images', f));

    try {
      const r = await fetch('/api/enrol/', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + accessToken },
        body: fd,
      });
      const d = await r.json();

      progress.style.display = 'none';
      result.style.display   = 'block';

      if (r.ok) {
        result.className = 'result success';
        result.innerHTML = `
          ✓ <strong>${name}</strong> enrolled successfully.<br>
          Embeddings saved: ${d.embeddings_saved} &nbsp;|&nbsp; Person ID: ${d.person_id}
          ${d.errors.length ? '<br>⚠ Some images failed: ' + d.errors.map(e => e.file).join(', ') : ''}
        `;
        // Reset form
        selectedFiles = [];
        renderPreviews();
        document.getElementById('name').value  = '';
        document.getElementById('emp-id').value = '';
        document.getElementById('dept').value   = '';
        document.getElementById('notes').value  = '';
      } else {
        result.className = 'result error';
        result.textContent = '✗ ' + (d.error || JSON.stringify(d));
      }
    } catch(e) {
      progress.style.display = 'none';
      result.style.display   = 'block';
      result.className = 'result error';
      result.textContent = '✗ Network error: ' + e.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
